# Linux visual-regression baseline CAPTURE: images only, never a comparison and never an acceptance.
#
# Triggers: a pull request to main that touches the frontend, the e2e gate or the dev fixtures, and
# manual dispatch. GitHub offers `workflow_dispatch` only for workflows already on the default
# branch, so before this file reaches main the pull request trigger is the only way to capture.
# Never on push. Read-only token, no secret, SYNTHETIC fixtures on a throwaway database; no
# provider is called. A fork's pull request runs with the same read-only token.
#
# The visual specs compare against per-platform baselines. The Windows ones (`*-win32.png`) are
# made locally; the Linux ones (`*-linux.png`) must come from the same runner image and browser as
# the CI e2e job (ubuntu-24.04, Playwright 1.64.0 Chromium, the runner's fonts), so they are
# captured here, on that runner, through the same e2e gate phases and synthetic fixtures.
#
# This workflow compares nothing and accepts nothing. It uploads the captured images as an
# artifact. A person reviews them and commits them together with `"linux": "accepted"` in
# frontend/tests/e2e/visual-baselines.json; from then on the CI e2e job must run those specs
# (frontend/tests/setup/visual-policy.ts). Procedure: docs/reports/frontend-final-stabilization.md.
name: visual-baselines

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/qa/**"
      - "scripts/dev/**"
      - ".github/workflows/visual-baselines.yml"

permissions:
  contents: read

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12.6"

jobs:
  capture:
    # The name says what this is: a capture for review. It is not a visual test and never a pass.
    name: Linux visual baseline capture (no comparison, not a test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Prepare (versions, throwaway env, Compose project, free ports)
        run: bash scripts/qa/e2e_gate.sh prepare
      - name: Install the backend from the exact lock
        run: bash scripts/qa/e2e_gate.sh install
      - name: Isolated PostgreSQL, migrations and price catalogue
        run: timeout 300 bash scripts/qa/e2e_gate.sh database
      - name: Start the real backend and wait for readiness
        run: bash scripts/qa/e2e_gate.sh backend
      - name: Frontend build, bundle secret scan and Playwright Chromium
        run: timeout 600 bash scripts/qa/e2e_gate.sh frontend
      - name: Capture Linux baselines (the visual specs and the specs that seed their data)
        # phase4d stores the golden dataset and mock experiments the UI-R4 visual spec reads;
        # the UI-R3 visual spec seeds its own sessions. Output is redacted like the e2e gate's.
        run: |
          set -o pipefail
          cd frontend
          LLMI_E2E_CI=1 LLMI_VISUAL_LINUX=1 timeout 900 npx playwright test \
            tests/e2e/phase4d.spec.ts tests/e2e/ui-r3-visual.spec.ts tests/e2e/ui-r4-visual.spec.ts \
            --update-snapshots=all --reporter=list 2>&1 \
            | python -I ../scripts/qa/e2e_check.py redact --env ../.env --env .env.local
      - name: Collect the Linux images and their checksums (no log, trace or report)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/visual-baselines"
          mkdir -p "$out"
          cd frontend/tests/e2e
          find . -path './*-visual.spec.ts-snapshots/*-linux.png' -print0 | xargs -0 -I{} cp --parents {} "$out/"
          (cd "$out" && find . -name '*-linux.png' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          count="$(find "$out" -name '*-linux.png' | wc -l)"
          echo "captured $count Linux baselines"
          [ "$count" -gt 0 ] || { echo "::error title=visual::no Linux baseline was captured"; exit 1; }
      - name: Upload the Linux baselines for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-visual-baselines
          path: ${{ runner.temp }}/visual-baselines
          if-no-files-found: error
          retention-days: 14
      - name: Clean up the resources of this run's Compose project only
        if: ${{ always() }}
        run: bash scripts/qa/e2e_gate.sh cleanup
