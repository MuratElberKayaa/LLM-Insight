# backend/requirements.lock; ast_serialize is held at 0.12.1 (0.13.x was released after the cutoff).
# Phase 2B: openai 3.28.0 (2026-10-09) and its new transitives httpx2/httpcore2 2.13.1, jiter 0.17.0, sniffio 1.3.1;
# truststore is held at 0.10.4 (0.10.5 was released after the cutoff).
# Phase 2C: fastapi 0.143.0, starlette 1.7.0, uvicorn 0.54.0, click 8.5.0, annotated-doc 0.0.5 for the FastAPI demo,
# all identical to backend/requirements.lock (no new version enters the project).
